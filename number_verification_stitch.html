<style>
        body {
            background-color: #EAF0F8;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .neumorphic-raised {
            background: #EAF0F8;
            box-shadow: 6px 6px 12px #d1d9e6, -6px -6px 12px #ffffff;
        }

        .neumorphic-inset {
            background: #EAF0F8;
            box-shadow: inset 4px 4px 8px #d1d9e6, inset -4px -4px 8px #ffffff;
        }

        .neumorphic-button-primary {
            background: #2563EB;
            box-shadow: 4px 4px 10px rgba(37, 99, 235, 0.3), -2px -2px 10px rgba(255, 255, 255, 0.8);
        }

        .orb-pulse {
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
    </style>

<body class="flex justify-center min-h-screen">
<!-- Mobile Container (390x844 approx simulation) -->
<main class="w-full max-w-[390px] min-h-[844px] flex flex-col relative overflow-hidden bg-background-base">
<!-- TopAppBar (Mapped from JSON style guidance) -->
<header class="flex justify-between items-center px-margin-page h-16 w-full z-50 sticky top-0 bg-background-base">
<div class="flex items-center gap-stack-sm">
<button class="active:scale-95 transition-transform hover:opacity-80 p-2">
<span class="material-symbols-outlined text-secondary">arrow_back</span>
</button>
<img alt="DueMate" class="h-8 w-8 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLvbMejPu71LxcmoGoVKFx-KuuabxP3ZqgYCzVO-RzzfzDKS-bjKYHtl9vodmL-CeTlg2na7H7kYT0h8MzdW8x72dVdy6gQNLmH-8VHr0vZoQ1UJKfQzgztn13u3lyaM-_kuogfC9T-PPKAYSEpOkq6UeaJPXXLugGt2bdEaH8eOwDWPbOYCgRR4dV0re_HFaCne2aXjRN1kp9aPNbaNbG8syC1gWbA7CdcFH6YhJ-_fWXtdnYnNaMhtg0w"/>
</div>
<div class="flex items-center">
<span class="font-label-caps text-label-caps text-text-secondary px-3 py-1 neumorphic-inset rounded-full">Step 2 of 3</span>
</div>
</header>
<!-- Content Canvas -->
<div class="flex-1 px-margin-page py-stack-lg flex flex-col gap-stack-lg">
<!-- Hero Section -->
<section class="text-center flex flex-col items-center gap-stack-sm">
<div class="px-4 py-1.5 rounded-full bg-highlight-soft text-secondary font-label-caps text-[10px] uppercase tracking-wider mb-2">
                    WhatsApp Verification
                </div>
<h1 class="font-headline-md text-headline-md text-primary">Enter Your Number</h1>
<p class="font-body-md text-body-md text-text-secondary max-w-[280px]">
                    We'll send a verification code to your WhatsApp.
                </p>
</section>
<!-- Phone Input Card -->
<section class="neumorphic-raised rounded-[20px] p-gutter-card flex flex-col gap-stack-md">
<label class="font-label-caps text-label-caps text-text-secondary uppercase">WhatsApp Number</label>
<div class="relative flex items-center">
<div class="absolute left-4 flex items-center gap-2 text-text-secondary border-r border-outline-variant pr-3">
<span class="material-symbols-outlined text-[20px]">call</span>
<span class="font-body-md font-semibold text-primary">+92</span>
</div>
<input class="w-full h-14 pl-24 pr-4 neumorphic-inset border-none rounded-xl focus:ring-2 focus:ring-secondary/20 font-body-lg text-primary placeholder:text-outline-variant transition-all" placeholder="3XX-XXXXXXX" type="tel"/>
</div>
<!-- Primary Action -->
<button class="w-full h-[48px] rounded-xl neumorphic-button-primary text-white font-body-lg font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform mt-2">
                    Send Verification Code
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</section>
<!-- Trust Info -->
<section class="neumorphic-inset rounded-xl p-4 flex gap-4 items-start">
<div class="bg-secondary/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-secondary text-[20px]">lock</span>
</div>
<p class="font-body-sm text-body-sm text-text-secondary leading-relaxed">
                    Your number is only used to connect your DueMate WhatsApp assistant and send academic reminders.
                </p>
</section>
<!-- Visual Element / AI Assistant Orb -->
<div class="mt-auto mb-12 flex justify-center relative">
<div class="w-24 h-24 rounded-full bg-secondary/10 absolute orb-pulse blur-xl"></div>
<div class="relative neumorphic-raised w-20 h-20 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-[40px]" style="font-variation-settings: 'FILL' 0;">smart_toy</span>
<div class="absolute -top-1 -right-1 w-6 h-6 bg-success rounded-full border-4 border-background-base flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[12px] font-bold">check</span>
</div>
</div>
</div>
</div>
<!-- Minimal Footer -->

<button class="font-body-md text-text-secondary hover:text-primary transition-colors flex items-center gap-1 active:translate-y-0.5">
<span class="material-symbols-outlined text-[18px]">chevron_left</span>
                Back
            </button>
<!-- Decorative line -->
<div class="w-32 h-1.5 bg-outline-variant/30 rounded-full"></div>
</footer>
</main>
<script>
        // Micro-interactions for buttons
        document.querySelectorAll('.neumorphic-raised, .neumorphic-button-primary').forEach(button => {
            button.addEventListener('mousedown', () => {
                if(button.classList.contains('neumorphic-raised')) {
                    button.classList.remove('neumorphic-raised');
                    button.classList.add('neumorphic-inset');
                }
            });
            button.addEventListener('mouseup', () => {
                if(button.classList.contains('neumorphic-inset')) {
                    button.classList.remove('neumorphic-inset');
                    button.classList.add('neumorphic-raised');
                }
            });
        });

        // Simple placeholder animation for the "AI orb"
        const orb = document.querySelector('.orb-pulse');
        if (orb) {
            let opacity = 0.5;
            let growing = true;
            setInterval(() => {
                if (growing) {
                    opacity += 0.01;
                    if (opacity >= 0.8) growing = false;
                } else {
                    opacity -= 0.01;
                    if (opacity <= 0.3) growing = true;
                }
                orb.style.opacity = opacity;
            }, 50);
        }
    </script>
